# XcodeGen spec — the source of truth for the Xcode project.
# Run `xcodegen` to (re)generate Echo.xcodeproj identically on any machine.
# Two targets, one shared core (design §2): Echo (iPhone) and EchoMac (menu
# bar) both compile Sources/Shared; each adds its own platform folder.
name: Echo
options:
  bundleIdPrefix: com.rannyeri
  createIntermediateGroups: true

targets:
  Echo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Resources
        optional: true          # optional test assets, not required to build
    info:
      path: Sources/iOS/Info.plist   # generated by XcodeGen from the properties below
      properties:
        CFBundleDisplayName: Echo
        UILaunchScreen: {}
        # Keep Echo alive to play while backgrounded / screen locked during a run.
        UIBackgroundModes: [audio]
        # Talking to the Mac's Tailscale IP counts as "local network" on iOS.
        NSLocalNetworkUsageDescription: "Echo connects to your Mac over your private Tailscale network to receive voice clips."
        # The Mac endpoint is plain HTTP over Tailscale (already private), so
        # allow it past App Transport Security. Personal sideloaded app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rannyeri.echo
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"        # iPhone
        SWIFT_VERSION: "5.9"

  EchoMac:
    type: application
    platform: macOS
    # 14.4 is the floor for Core Audio process taps (CATapDescription) —
    # the ducking engine EchoMac is built on.
    deploymentTarget: "14.4"
    sources:
      - path: Sources/Shared
      - path: Sources/macOS
    info:
      path: Sources/macOS/Info.plist   # generated by XcodeGen from the properties below
      properties:
        CFBundleDisplayName: Echo
        # macOS files the per-app audio tap under system-audio capture; this
        # string is what the one-time permission prompt shows.
        NSAudioCaptureUsageDescription: "Echo ducks other apps' audio while a voice message plays — the audio tap is how it takes over and dims their output."
        # The AppleScript fallback duck scripts Spotify/Music volume.
        NSAppleEventsUsageDescription: "Echo can dip Spotify or Music's volume as a fallback duck when the audio tap isn't permitted."
        # Same private-network HTTP as iOS (127.0.0.1 / Tailscale).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rannyeri.echo.mac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        # Unsandboxed on purpose (design §5): a sandboxed app needs extra
        # entitlements for AppleScript, and the process tap is a local,
        # personally-signed tool. No App Store ambitions here.
        ENABLE_APP_SANDBOX: NO
